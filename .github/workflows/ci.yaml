name: Builder

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  builder:
    name: builder (${{ matrix.go }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ["1.18", "1.19", "1.20", "1.21", "1.22", "1.23", "1.24", "1.25", "1.26", "1.27"]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Setup golang
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Tests
        run: make test
      - name: Coverage
        if: matrix.go == '1.27'
        run: make coverage
      - name: Upload coverage reports to Coveralls
        if: matrix.go == '1.27'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          format: golang
          file: coverage.out
